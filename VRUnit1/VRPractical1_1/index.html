    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

    <a-scene>


<a-sky src ="road.jpg"></a-sky>
<a-plane rotation="-90 0 0" position="0 -0.7 0 " width="30" height="30" src=" clay.jpg "></a-plane>

<!-- TRUCK 1  blue (container) -->
<a-box wireframe="true" position="0 0 -1" width="1.7" height="1.4" depth="3.6">

  <!-- lower body (teal) -->
  <a-box position="0 -0.3 0" width="1.4" height="0.4" depth="3.4" color="#white"></a-box>

  <!-- cab: teal bottom, white top -->
  <a-box position="0 0.05 0.8" width="1.4" height="0.4" depth="1.4" color="#004c99"></a-box>
  <a-box position="0 0.45 0.8" width="1.3" height="0.4" depth="1.3" color="c0392b"></a-box>

  <!-- windows -->
  <a-box position="0 0.45 1.46" width="1.1" height="0.3" depth="0.04" color="#aee" opacity="0.6"></a-box>
  <a-box position="0.66 0.45 0.8" width="0.04" height="0.3" depth="0.9" color="#aee" opacity="0.6"></a-box>
  <a-box position="-0.66 0.45 0.8" width="0.04" height="0.3" depth="0.9" color="#aee" opacity="0.6"></a-box>

  <!-- truck bed -->
  <a-box position="0.65 0.15 -0.75" width="0.1" height="0.4" depth="1.7" color="#004c99"></a-box>
<a-box position="-0.65 0.15 -0.75" width="0.1" height="0.4" depth="1.7" color="#004c99"></a-box>
  
  
  


  <!-- rounded white bumpers -->
  <a-cylinder position="0 -0.45 1.72" rotation="0 0 90" radius="0.08" height="1.5" color="white"></a-cylinder>
  <a-cylinder position="0 -0.45 -1.72" rotation="0 0 90" radius="0.08" height="1.5" color="white"></a-cylinder>

  <!-- badge on the grille -->
  <a-circle position="0 -0.05 1.71" radius="0.16" color="white"></a-circle>
  <a-ring position="0 -0.05 1.715" radius-inner="0.09" radius-outer="0.13" color="#4f5a2e"></a-ring>

  <!-- headlights and taillights -->
  <a-sphere position="0.5 -0.2 1.7" radius="0.1" color="orange"></a-sphere>
  <a-sphere position="-0.5 -0.2 1.7" radius="0.1" color="orange"></a-sphere>
  <a-box position="0.5 -0.2 -1.71" width="0.2" height="0.1" depth="0.04" color="red"></a-box>
  <a-box position="-0.5 -0.2 -1.71" width="0.2" height="0.1" depth="0.04" color="red"></a-box>

  <!-- wheels + white hubcaps -->
  <a-cylinder position="0.7 -0.45 1" rotation="0 0 90" radius="0.25" height="0.2" color="#3a3a3a"></a-cylinder>
  <a-cylinder position="0.7 -0.45 1" rotation="0 0 90" radius="0.12" height="0.22" color="white"></a-cylinder>
  <a-cylinder position="-0.7 -0.45 1" rotation="0 0 90" radius="0.25" height="0.2" color="#222"></a-cylinder>
  <a-cylinder position="-0.7 -0.45 1" rotation="0 0 90" radius="0.12" height="0.22" color="white"></a-cylinder>
  <a-cylinder position="0.7 -0.45 -1" rotation="0 0 90" radius="0.25" height="0.2" color="#222"></a-cylinder>
  <a-cylinder position="0.7 -0.45 -1" rotation="0 0 90" radius="0.12" height="0.22" color="white"></a-cylinder>
  <a-cylinder position="-0.7 -0.45 -1" rotation="0 0 90" radius="0.25" height="0.2" color="#222"></a-cylinder>
  <a-cylinder position="-0.7 -0.45 -1" rotation="0 0 90" radius="0.12" height="0.22" color="white"></a-cylinder>
</a-box>
